# =============================================================================
# pyproject.toml: project settings in one place
#
# Describes the project (name, version, Python 3.11+) and configures its tools:
# pytest (tests), pyright (editor imports) and ruff (linting). Each tool reads
# only its own [section]. Dependencies are in requirements-dev.txt, not here.
# =============================================================================

[project]
name = "innovabank"
version = "1.0.0"
description = "An agentic banking assistant on AWS in two postures, vulnerable and hardened, with one automated attack bench against both."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Xavier Dupuis" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app", "harness", "supplychain"]

[tool.pyright]
# Editor only (Pylance/pyright): same source roots as PYTHONPATH and pytest above,
# so imports like innovabank.config resolve. Has no effect at runtime.
extraPaths = ["app", "harness", "supplychain"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle errors and warnings, import order, bugbear, pyupgrade, pylint errors.
# E501 is left out: long lines are mostly test fixtures and attack strings.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP", "PLE"]

[tool.ruff.lint.isort]
known-first-party = ["innovabank", "innovabank_harness", "ib_supplychain"]
